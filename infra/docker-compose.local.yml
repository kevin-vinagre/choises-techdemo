version: "3.9"


services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: choises-backend
    restart: unless-stopped
    ports:
      -"8081"
    env_file:
      - ../backend/.env
    command: sh -c "npx prisma migrate deploy && node ./src/app.js"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge